[workspace]
resolver = "2"
members = [
    "shared/shiver-core",
    "shared/sharkord-client",
    "desktop/src-tauri",
    "mobile/src-tauri",
    "mobile/plugins/tauri-plugin-shiver-secrets",
    "mobile/plugins/tauri-plugin-shiver-push",
]

# The one place Shiver's version lives. Every crate inherits it, and both `tauri.conf.json` files
# omit `version` so Tauri takes it from the crate.
[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
shiver-core = { path = "shared/shiver-core" }
sharkord-client = { path = "shared/sharkord-client" }
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["serde"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
