# The dependency audit: on every push and pull request, and weekly, so an advisory published while
# nothing is pushed still shows up (docs/standards.md, Security baseline rule 4). A failed scheduled
# run emails the owner. Nothing here needs a secret.
name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cargo-audit
      # a fixed release, so a new publish cannot run here unreviewed
      - run: cargo install cargo-audit --locked --version 0.22.2
      # one workspace, one lockfile
      - run: cargo audit
      # and each app's JavaScript (the bridge ships inside every server page); only the lockfile is read
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun audit
        working-directory: desktop
      - run: bun audit
        working-directory: mobile
