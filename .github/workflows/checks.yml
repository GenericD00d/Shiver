# Checks only, never builds a release (releases need signing keys that stay local, see
# RELEASING.md). Nothing here needs a secret, so it is safe to run on pull requests from anyone.
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows: Shiver ships there, and Tauri needs no system packages on it.
  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      # the bridges are `include_str!`'d; without this the crates compile against placeholders
      - name: Build the bridges
        shell: bash
        run: |
          (cd desktop && bun install --frozen-lockfile && bun run build:bridge)
          (cd mobile && bun install --frozen-lockfile && bun run build:bridge)

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The shared crates hold the protocol and storage logic, and need nothing platform-specific.
  shared:
    name: Shared crates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: shared
      - run: cargo test -p shiver-core -p sharkord-client

  # A debug build of the Android app, which is the only thing that compiles its Kotlin, manifest
  # and resources. Debug signs with the generated debug key, so no secret is needed.
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: android
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: mobile

      # The image's own SDK and NDK. Licence acceptance exits non-zero on this image, so it is
      # tolerated; installing the pinned platform (compileSdk 36) is not.
      - name: Android SDK
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$sdkmanager" ] || { echo "no sdkmanager under $ANDROID_HOME/cmdline-tools" >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # `gen/android` is ignored except for the hand-written files, which init must not replace
      - name: Generate the Android project
        run: |
          (cd mobile && ./node_modules/.bin/tauri android init)
          git status --porcelain mobile/src-tauri/gen/android
          git checkout -- mobile/src-tauri/gen/android

      # The generated Gradle task runs the CLI through the package manager Tauri detected, which
      # differs on this runner; point it at the CLI binary directly (both edits are asserted).
      - name: Point the Gradle task at the Tauri CLI
        run: |
          python3 - <<'PATCH'
          import os, pathlib, re, sys

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          found = list(root.glob("mobile/src-tauri/gen/android/buildSrc/**/BuildTask.kt"))
          if len(found) != 1:
              sys.exit(f"expected one BuildTask.kt, found {found}")

          cli = root / "mobile" / "node_modules" / ".bin" / "tauri"
          source = found[0].read_text(encoding="utf8")
          source, runner = re.subn(r'val executable = """[^"]*"""', f'val executable = """{cli}"""', source, count=1)
          source, named = re.subn(r'listOf\("tauri", "android", "android-studio-script"\)', 'listOf("android", "android-studio-script")', source, count=1)
          if not runner or not named:
              print(source, file=sys.stderr)
              sys.exit("android init changed the shape of BuildTask.kt")

          found[0].write_text(source, encoding="utf8")
          PATCH

      - name: Build the debug APK
        run: ./node_modules/.bin/tauri android build --apk --debug --target aarch64
        working-directory: mobile

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: cargo-audit
      - run: cargo install cargo-audit --locked
      # one workspace, one lockfile
      - run: cargo audit

  frontend:
    name: Frontends and plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Desktop
        run: bun install --frozen-lockfile && bunx tsc --noEmit
        working-directory: desktop

      - name: Mobile
        run: bun install --frozen-lockfile && bunx tsc --noEmit
        working-directory: mobile

      - name: Shared web tests
        run: bun test shared/web

      # plain ES modules with no build step
      - name: Companion plugin
        run: |
          for file in server/*.js client/*.js; do node --check "$file"; done
          node --test test/*.test.js
        working-directory: plugin

      - name: Versions agree
        run: python3 scripts/check-version.py
