# Weekly: whether Sharkord's latest source still has what the bridges match (test ids, storage keys,
# classes, notification titles). A failure here means a coming Sharkord release will break a
# bridge; `checks.yml` runs the same check at the commit the bridges were last checked against.
name: Sharkord drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Bridges against Sharkord's latest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-sharkord.py --latest
