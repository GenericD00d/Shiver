[package]
name = "shiver-mobile"
description = "Shiver for Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "shiver_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification = "2.4.0"
tauri-plugin-shiver-secrets = { path = "../plugins/tauri-plugin-shiver-secrets" }
tauri-plugin-shiver-push = { path = "../plugins/tauri-plugin-shiver-push" }
sharkord-client.workspace = true
shiver-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# the update check follows GitHub's release redirect, so it has its own client
reqwest.workspace = true
semver = "1"
sha2 = "0.10"
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

