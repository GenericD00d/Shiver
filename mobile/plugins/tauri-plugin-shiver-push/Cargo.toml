[package]
name = "tauri-plugin-shiver-push"
version.workspace = true
description = "UnifiedPush wake-ups for Shiver on Android, so a closed app can still be told there are messages"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
# required by tauri's plugin build script, which keys the android project on it
links = "tauri-plugin-shiver-push"

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies.tauri-plugin]
version = "2.5"
features = ["build"]
