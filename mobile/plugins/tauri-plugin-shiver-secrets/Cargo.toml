[package]
name = "tauri-plugin-shiver-secrets"
version = "0.1.0"
description = "Encrypted at-rest storage for Shiver on Android"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
# required by tauri's plugin build script, which keys the android project on it
links = "tauri-plugin-shiver-secrets"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies.tauri-plugin]
version = "2.5"
features = ["build"]
