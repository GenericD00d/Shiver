[package]
name = "shiver"
description = "A multi-server desktop client for Sharkord"
authors = ["Shiver"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# the _lib suffix keeps the library name from colliding with the binary name on windows
name = "shiver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# `unstable` exposes Window::add_child, the multi-webview api the rail is built on
tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-updater = "2"
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut = "2"
sharkord-client.workspace = true
shiver-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
thiserror.workspace = true

# the os credential store; there is no android/ios backend
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# WebView2 profile access, only for resetting camera/microphone permissions
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_System_Com"] }
